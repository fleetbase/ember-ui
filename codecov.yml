coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: 'condensed_header, diff, flags, files'
  behavior: default
  require_changes: false

flags:
  ember-ui:
    paths:
      - addon/
    carryforward: false
